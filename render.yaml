services:
  - type: web
    name: vital-coach-api
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: npm run start:coach
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
